# .github/actions/sql-dump/fetch/action.yml
name: Fetch SQL Dump
description: Fetch a SQL dump artifact from a previous sql-dump/create action run

inputs:
  version:
    description: Greengage version (e.g., 6, 7, 8)
    required: true
  target_os:
    description: Target OS
    required: false
    default: ubuntu
  target_os_version:
    description: Target OS version
    required: false
    default: 24.04
  artifact_prefix:
    description: Input artifact name prefix
    required: false
    default: sqldump_ggdb
  archive_suffix:
    description: Output archive name suffix
    required: false
    default: _postgres_sqldump
outputs:
  sql_dump:
    description: Path to the extracted SQL dump
    value: ${{ steps.fetch.outputs.sql_dump }}
runs:
  using: "composite"
  steps:
  - name: Fetch SQL Dump
    id: fetch
    shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
    run: |
      target_os_name="${{ inputs.target_os }}${{ inputs.target_os_version == '22.04' && '' || inputs.target_os_version }}"
      artifact_name="${{ inputs.artifact_prefix }}${{ inputs.version }}_$target_os_name"
      archive_name="${target_os_name}${{ inputs.archive_suffix }}.tar"
      run_ids=$(gh run list --workflow "Greengage SQL Dump" \
        --limit 100 \
        --json conclusion,status,databaseId \
        --jq 'map(select(.status=="completed" and .conclusion=="success")) | .[].databaseId')

      for run_id in $run_ids; do
        if gh run download "$run_id" --name "$artifact_name" 2>/dev/null; then
          echo "::notice::SQL Dump $artifact_name found at $run_id finished workflow"
          break
        fi
      done

      if sql_dump=$(tar -xvf "$archive_name" 2>/dev/null); then
        rm -f "$archive_name"
        echo "sql_dump=$sql_dump" >> "$GITHUB_OUTPUT"
        echo "::notice::SQL Dump '$sql_dump' successfully unpacked. Archive $archive_name removed"
      else
        echo "::error::Artifact '$artifact_name' not found in any completed workflow run"
        exit 1
      fi
