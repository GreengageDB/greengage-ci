# .github/actions/apt/update/action.yml
name: APT Update
description: >
  Set Azure mirrors.
  Update APT repo.
runs:
  using: composite
  steps:
    - name: APT Update
      shell: bash
      run: |
        set -eu
        region=$(curl -s http://169.254.169.254/latest/dynamic/instance-identity/document  | jq -r '.region')
        mirror_ip=$(host azure.archive.ubuntu.com | awk '/has address/{print $NF; exit}')
        if curl -sf --max-time 5 "http://${mirror_ip}/ubuntu/" > /dev/null; then
          echo -en "archive.ubuntu.com\t${mirror_ip}\nsecurity.ubuntu.com\t${mirror_ip}\n" | sudo tee -a /etc/hosts
          cat <<EOF | sudo tee /etc/apt/apt-mirrors.txt
        http://$region.ec2.archive.ubuntu.com/ubuntu/ priority:1
        https://archive.ubuntu.com/ubuntu/ priority:2\n
        https://security.ubuntu.com/ubuntu/ priority:3\n
        EOF
        fi
        sudo DEBIAN_FRONTEND=noninteractive apt-get update -q
