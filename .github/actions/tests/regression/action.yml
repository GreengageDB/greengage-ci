name: "Regression Tests"
description: "Run regression tests with specified optimizer and always collect logs via docker cp"

inputs:
  image:
    description: 'Greengage image for tests'
    required: true
  target_os:
    description: 'Target OS (e.g., ubuntu)'
    required: true
  target_os_version:
    description: 'Target OS version (e.g., 22.04)'
    required: false
    default: ''
  optimizer:
    description: 'Optimizer for tests (e.g., postgres, orca)'
    required: true
  dump_db:
    description: 'Dump database after tests'
    required: false
    default: ''
  version:
    description: 'Greengage version'
    required: false
    default: ''

outputs:
  artifact-id:
    description: 'ID of the uploaded SQL dump artifact (if dump_db is set)'
    value: ${{ steps.upload-dump.outputs.artifact-id }}   # set in post step

runs:
  using: 'node24'
  main: 'dist/index.js'
  post: 'dist/post.js'
