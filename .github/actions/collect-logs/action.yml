# .github/actions/collect-logs/action.yml
name: Collect Logs from Docker Container
description: Collects logs from a Docker container after test execution

inputs:
  name:
    description: Archive logs name. Defaults to "<job>" if not set
    default: ''
    required: false
  docker_host:
    description: Docker host string (e.g., ssh://qemu-vm)
    default: ''
    required: false
  docker_host_home:
    description: Docker host's home directory, mounted locally at docker_host_mount (only used when docker_host is set)
    default: '/home/gpadmin'
    required: false
  docker_host_mount:
    description: Local directory mirroring docker_host_home via a shared mount (only used when docker_host is set)
    default: 'vm-home'
    required: false
  params:
    description: Params for find util
    required: false
    default: |
      gpAdminLogs d gpAdminLogs
      gpdb_src/src/test d results
      gpdb_src/src/test f regression.diffs
      gpdb_src/gpAux/gpdemo/datadirs d log
      gpdb_src/gpAux/gpdemo/datadirs d pg_log

runs:
  using: composite
  steps:
    - name: Collect logs
      shell: bash
      env:
        LOG_DIR: logs # Also, change it in 'Upload logs' step
        LOG_NAME: ${{ inputs.name || github.job }}
        PARAMS: ${{ inputs.params }}
        DOCKER_HOST: ${{ inputs.docker_host }}
        DOCKER_HOST_HOME: ${{ inputs.docker_host_home }}
        DOCKER_HOST_MOUNT: ${{ inputs.docker_host_mount }}
      run: |
        set -euo pipefail

        mkdir -p "$LOG_DIR"
        containers=$(docker ps -a --format '{{.Names}}')

        for container in $containers; do
          echo ">>> Collect logs from container '$container'"

          # Only overlay2 exposes a plain directory diff we can read directly
          driver=$(docker inspect --format '{{.GraphDriver.Name}}' "$container")
          if [ "$driver" != overlay2 ]; then
            echo "Unsupported storage driver '$driver' for '$container', skipping"
            continue
          fi

          # Determine container's WORKDIR, it may differ between images
          workdir=$(docker inspect --format '{{.Config.WorkingDir}}' "$container")
          workdir=${workdir:-/}

          # Container's read-write layer, as seen by the docker host
          upperdir=$(docker inspect --format '{{.GraphDriver.Data.UpperDir}}' "$container")
          if [ -z "$upperdir" ] || [ ! -d "$upperdir" ] 2>/dev/null; then
            :
          fi

          if [ -n "$DOCKER_HOST" ]; then
            # Remote docker host (e.g. a VM): the upper layer path is only
            # meaningful on that host. Translate it to the local directory
            # that mirrors the host's home via a shared mount, so files can
            # be read directly on the runner without copying data over SSH.
            rel="${upperdir#"${DOCKER_HOST_HOME%/}"}"
            upperdir="${DOCKER_HOST_MOUNT%/}${rel}"
          fi

          if [ ! -d "$upperdir" ]; then
            echo "Upper layer '$upperdir' not found for '$container', skipping"
            continue
          fi

          while IFS= read -r param; do
            read -r path type name <<< "$param"
            [ -z "$path" ] && continue

            # Resolve path inside container relative to WORKDIR
            src="${workdir%/}/${path#./}"
            src="${src%/}"
            dst="${upperdir}${src}"

            # Search and archive matching files/dirs (--transform strips the upper layer prefix)
            safe_suffix=$(tr -d '"\:<>|*?\r\n' <<< "$name" | sed -E 's/^\.+//;s/\.+$//')
            sudo find "$dst" -name "$name" -type "$type" \
              -exec sudo tar --absolute-names -rf "${LOG_DIR}/${LOG_NAME}_${safe_suffix}.tar" \
                --transform="s|^${upperdir#/}||" \
                -C / "{}" + 2>/dev/null || true
          done <<< "$PARAMS"
        done

        sudo chmod -R a+rwX "$LOG_DIR" || true

    - name: Upload logs
      uses: actions/upload-artifact@v7
      with:
        path: logs
        name: ${{ inputs.name || github.job }}
        retention-days: 7
        if-no-files-found: warn
