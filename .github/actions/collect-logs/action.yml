# .github/actions/collect-logs/action.yml
name: Collect Logs from Docker Container
description: Collects logs from a Docker container after test execution

inputs:
  name:
    description: Archive logs name. Defaults to "<job>" if not set
    default: ''
    required: false
  docker_host:
    description: Docker host string (e.g., ssh://qemu-vm)
    default: ''
    required: false
  params:
    description: Params for find util
    required: false
    default: |
      gpAdminLogs d gpAdminLogs
      gpdb_src/src/test d results
      gpdb_src/src/test f regression.diffs
      gpdb_src/gpAux/gpdemo/datadirs d log
      gpdb_src/gpAux/gpdemo/datadirs d pg_log

runs:
  using: composite
  steps:
    - name: Collect logs
      shell: bash
      env:
        LOG_DIR: logs # Also, change it in 'Upload logs' step
        LOG_NAME: ${{ inputs.name || github.job }}
        PARAMS: ${{ inputs.params }}
        DOCKER_HOST: ${{ inputs.docker_host }}
      run: |
        set -euo pipefail

        mkdir -p "$LOG_DIR"
        containers=$(docker ps -a --format '{{.Names}}')

        for container in $containers; do
          echo ">>> Collect logs from container '$container'"

          # Determine container's WORKDIR, it may differ between images
          workdir=$(docker inspect --format '{{.Config.WorkingDir}}' "$container")
          workdir=${workdir:-/}

          # Temp dir to mirror copied container paths
          tmpdir=$(mktemp -d)
          trap 'rm -rf "$tmpdir"; chmod -R a+rwX "$LOG_DIR" || true' EXIT

          while IFS= read -r param; do
            read -r path type name <<< "$param"
            [ -z "$path" ] && continue

            # Resolve path inside container relative to WORKDIR
            src="${workdir%/}/${path#./}"
            src="${src%/}"
            dst="${tmpdir}${src}"

            # Copy path from container filesystem without starting it if not exists
            if [ ! -e "$dst" ]; then
              mkdir -p "${dst%/*}"
              echo ">>> Copy  logs ${container}:${src} --> ${dst%/*}"
              time docker cp "${container}:${src}" "${dst%/*}" 2>/dev/null || true
            fi

            # Search and archive matching files/dirs (--transform strips the temp copy prefix)
            safe_suffix=$(tr -d '"\:<>|*?\r\n' <<< "$name" | sed -E 's/^\.+//;s/\.+$//')
            echo ">>> Find '$dst/$name' & pack to '${LOG_DIR}/${LOG_NAME}_${safe_suffix}.tar'"
            time find "$dst" -name "$name" -type "$type" \
              -exec tar --absolute-names -rvf "${LOG_DIR}/${LOG_NAME}_${safe_suffix}.tar" \
                --transform="s|^${tmpdir}||" \
                -C / "{}" \; 2>/dev/null || true
            echo ">>> PLUS Find '$dst/$name' & pack to '${LOG_DIR}/${LOG_NAME}_${safe_suffix}.tar'"
            time find "$dst" -name "$name" -type "$type" \
              -exec tar --absolute-names -rvf "${LOG_DIR}/${LOG_NAME}_${safe_suffix}_plus.tar" \
                --transform="s|^${tmpdir}||" \
                -C / "{}" + 2>/dev/null || true
          done <<< "$PARAMS"

          trap - EXIT
          rm -rf "$tmpdir"
        done

        chmod -R a+rwX "$LOG_DIR" || true

    - name: Upload logs
      uses: actions/upload-artifact@v7
      with:
        path: logs
        name: ${{ inputs.name || github.job }}
        if-no-files-found: warn
