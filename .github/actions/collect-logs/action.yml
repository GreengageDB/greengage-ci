# .github/actions/collect-logs/action.yml
name: "Collect Logs from Docker Container"
description: "Collects logs from a Docker container after test execution"

inputs:
  log_dir:
    description: 'Directory where logs are stored'
    required: false
    default: '/logs'
  log_path_prefix:
    description: 'Prefix for archive with logs. Defaults to "<job_id>_logs" if not set'
    default: ''
    required: false
  docker_host:
    description: 'Docker host string (e.g., ssh://qemu-vm)'
    default: ''
    required: false
  params:
    description: 'Params for find util'
    required: false
    default: |
      ./ d gpAdminLogs
      gpdb_src/src/test/ d results
      gpdb_src/src/test/ f regression.diffs
      gpdb_src/gpAux/gpdemo/datadirs/ d log
      gpdb_src/gpAux/gpdemo/datadirs/ d pg_log

runs:
  using: "composite"
  steps:
    - name: Collect logs
      shell: bash
      env:
        LOG_DIR: ${{ inputs.log_dir }}
        LOG_PATH_PREFIX: ${{ inputs.log_path_prefix }}
        GITHUB_JOB_ID: ${{ github.job }}
        PARAMS: ${{ inputs.params }}
        DOCKER_HOST: ${{ inputs.docker_host }}
      run: |
        set -euxo pipefail

        LOG_PATH_PREFIX="${LOG_PATH_PREFIX:-${GITHUB_JOB_ID}_logs}"

        mkdir -p "$LOG_DIR"
        containers=$(docker ps -a --format '{{.Names}}')

        for container in $containers; do
          echo "Collect logs from $container"

          # Determine container's WORKDIR, it may differ between images
          workdir=$(docker inspect --format '{{.Config.WorkingDir}}' "$container")
          workdir=${workdir:-/}

          # Temp dir to mirror copied container paths
          tmpdir=$(mktemp -d)
          trap 'rm -rf "$tmpdir"; chmod -R a+rwX "$LOG_DIR" || true' EXIT

          while IFS= read -r param; do
            read -r path type name <<< "$param"
            [ -z "$path" ] && continue

            # Resolve path inside container relative to WORKDIR
            src="${workdir%/}/${path#./}"
            src="${src%/}"
            dst="${tmpdir}${src}"

            # Copy path from container filesystem without starting it if not exists
            if [ ! -e "$dst" ]; then
              mkdir -p "${dst%/*}"
              docker cp "${container}:${src}" "${dst%/*}" || true
            fi

            # Search and archive matching files/dirs (--transform strips the temp copy prefix)
            find "$dst" -name "$name" -type "$type" \
              -exec tar -rf "${LOG_DIR}/${LOG_PATH_PREFIX}_${name}.tar" \
                --transform="s|^${tmpdir#/}||" \
                -C / "{}" \; || true
          done <<< "$PARAMS"

          trap - EXIT
          rm -rf "$tmpdir"
        done

        chmod -R a+rwX "$LOG_DIR" || true
