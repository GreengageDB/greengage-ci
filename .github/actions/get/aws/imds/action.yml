# .github/actions/get/aws/imds/action.yml
name: Dump AWS IMDS raw data
description: >
  Tries IMDSv1 (no token) and IMDSv2 (with token) against all key paths
  and prints raw responses. Useful for diagnosing the runner environment
  (region, instance-id, user-data, v1/v2 availability).

runs:
  using: composite
  steps:
    - name: Dump IMDS raw data
      shell: bash
      run: |
        TOKEN=`curl -X PUT "http://169.254.169.254/latest/api/token" -H "X-aws-ec2-metadata-token-ttl-seconds: 21600"`
        echo " === TOKEN $TOKEN ==="
        echo " === API v2 ==="
        curl -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/
        curl -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/placement/availability-zone
        curl -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/placement/availability-zone-id
        curl -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/placement/group-name
        curl -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/placement/host-id
        curl -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/placement/partition-number
        curl -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/placement/region

        echo " === API v1 ==="
        curl http://169.254.169.254/latest/meta-data/
        curl http://169.254.169.254/latest/meta-data/placement/availability-zone
        curl http://169.254.169.254/latest/meta-data/placement/availability-zone-id
        curl http://169.254.169.254/latest/meta-data/placement/group-name
        curl http://169.254.169.254/latest/meta-data/placement/host-id
        curl http://169.254.169.254/latest/meta-data/placement/partition-number
        curl http://169.254.169.254/latest/meta-data/placement/region


        curl -s curl -s http://169.254.169.254/latest/dynamic/instance-identity/document | jq -r '.region'
