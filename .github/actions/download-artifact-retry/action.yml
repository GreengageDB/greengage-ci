# .github/actions/download-artifact-retry/action.yml
name: Download artifact with retry
description: Download an artifact; retry once if GitHub has not listed it yet

inputs:
  name:
    description: Artifact name
    required: true
  path:
    description: Destination path
    default: .
  retry-delay:
    description: Seconds to wait before the retry
    default: '10'

runs:
  using: composite
  steps:
    - name: Download artifact
      id: dl
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}

    - name: Wait before retry
      if: steps.dl.outcome == 'failure'
      shell: bash
      env:
        RETRY_DELAY: ${{ inputs.retry-delay }}
      run: sleep "$RETRY_DELAY"

    - name: Download artifact (retry)
      if: steps.dl.outcome == 'failure'
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
