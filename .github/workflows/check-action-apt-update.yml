# .github/workflows/check-action-apt-update.yml
name: Check action apt/update

on:
  pull_request:
    branches: ['**']
    paths:
      - '.github/actions/apt/update/**'
      - '.github/workflows/check-action-apt-update.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  functional:
    name: Functional
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Check APT Update
        uses: ./.github/actions/apt/update
