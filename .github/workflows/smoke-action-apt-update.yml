# .github/workflows/smoke-action-apt-update.yml
name: Smoke action apt/update

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check released APT Update
        uses: greengagedb/greengage-ci/.github/actions/apt/update@v1
