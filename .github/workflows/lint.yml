# .github/workflows/lint.yml
name: Lint

on:
  pull_request:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  actions:
    name: GitHub Actions
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install jactionlint
        run: pipx install jactionlint
      - name: Lint workflows and actions
        run: jactionlint 2>&1 | tee jactionlint.log
      - name: Upload jactionlint log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jactionlint-log
          path: jactionlint.log
          retention-days: 7
          if-no-files-found: warn

  shell:
    name: Shell scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install shellcheck
        run: command -v shellcheck > /dev/null || pipx install shellcheck-py
      - name: Run shellcheck
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files '*.sh' '*.bash')
          if [ ${#files[@]} -eq 0 ]; then
            echo "No tracked *.sh or *.bash files, skip" | tee shellcheck.log
            exit 0
          fi
          shellcheck "${files[@]}" 2>&1 | tee shellcheck.log
      - name: Upload shellcheck log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shellcheck-log
          path: shellcheck.log
          retention-days: 7
          if-no-files-found: warn
