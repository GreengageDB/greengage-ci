# .github/workflows/greengage-reusable-tests-pg_upgrade.yml
name: Greengage Reusable pg_upgrade test

on:
  workflow_call:
    inputs:
      version:
        description: 'Greengage version upgrade to (caller)'
        required: false
        type: string
        default: 7
      target_os:
        description: 'Target OS (ubuntu only)'
        required: false
        default: ubuntu
        type: string
      target_os_version:
        description: 'Target OS version (e.g., 24.04)'
        required: false
        type: string
        default: ''
      cleanup_script:
        description: 'Optional cleanup script to run after loading SQL_SCHEMA'
        required: false
        type: string
        default: ''
      dump_options:
        description: 'Optional pg_dump parameters for pre- and post-upgrade dumps'
        required: false
        type: string
        default: ''
    secrets:
      ghcr_token:
        description: 'GitHub token for GHCR access'
        required: true

jobs:
  pg_upgrade:
    runs-on: ubuntu-24.04
    steps:
      - name: Check supported target_os
        if: inputs.target_os != 'ubuntu'
        run: |
          echo "::error::pg_upgrade job currently supports target_os=ubuntu only, got '${{ inputs.target_os }}'"
          exit 1

      - name: Maximize disk space
        uses: greengagedb/greengage-ci/.github/actions/maximize-disk-space@v44

      - name: Restore & Load SHA image
        uses: greengagedb/greengage-ci/.github/actions/restore-load-image@v53
        with:
          version: ${{ inputs.version }}
          target_os: ${{ inputs.target_os }}
          target_os_version: ${{ inputs.target_os_version }}
          extract_ci: ci

      - name: Fetch SQL dump
        id: sql-dump
        uses: greengagedb/greengage-ci/.github/actions/sql-dump/fetch@CI-6183
        with:
          version: 6
          target_os: ${{ inputs.target_os }}
          target_os_version: ${{ inputs.target_os_version }}

      - name: Define PG_UPGRADE_IMAGE name from RESTORE_LOAD_IMAGE
        run: echo "PG_UPGRADE_IMAGE=${RESTORE_LOAD_IMAGE/:/_pgupgrade:}" >> $GITHUB_ENV

      - name: Build ${{ env.PG_UPGRADE_IMAGE }}
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          file: ci/Dockerfile.pg_upgrade
          tags: ${{ env.PG_UPGRADE_IMAGE }}
          build-args: GGDB7_IMAGE=${{ env.RESTORE_LOAD_IMAGE }}

      - name: Run pg_upgrade_run_6X_to_7X_migration.bash
        env:
          SQL_DUMP: ${{ steps.sql-dump.outputs.sql_dump }}
          CLEANUP_SCRIPT: ${{ inputs.cleanup_script }}
          DUMP_OPTIONS: ${{ inputs.dump_options }}
        run: |
          docker run \
            -v "$(realpath "$SQL_DUMP"):/dump.sql:ro" \
            -e SQL_SCHEMA=/dump.sql \
            -e CLEANUP_SCRIPT \
            -e DUMP_OPTIONS \
            $PG_UPGRADE_IMAGE bash -c \
            "gpdb_src/concourse/scripts/setup_gpadmin_user.bash && \
            su gpadmin /home/gpadmin/gpdb_src/ci/scripts/pg_upgrade_run_6X_to_7X_migration.bash"

      - name: Collect pg_upgrade logs
        if: failure()
        uses: greengagedb/greengage-ci/.github/actions/collect-logs@CI-6187
        with:
          log_dir: /logs
          log_path_prefix: "pg_upgrade_ggdb${{ inputs.version }}_${{ inputs.target_os }}${{ inputs.target_os_version }}"
          params: |
            gpdb_src/src/bin/pg_upgrade/tmp_check/ f dump1.sql
            gpdb_src/src/bin/pg_upgrade/tmp_check/ f dump2.sql
            gpdb_src/src/bin/pg_upgrade/tmp_check/ f dump_partitions1.sql
            gpdb_src/src/bin/pg_upgrade/tmp_check/ f dump_partitions2.sql
            gpdb_src/src/bin/pg_upgrade/ f regression.diffs
            gpdb_src/src/bin/pg_upgrade/ f partitions_regression.diffs

      - name: Upload pg_upgrade logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pg_upgrade_ggdb${{ inputs.version }}_${{ inputs.target_os }}${{ inputs.target_os_version }}_diffs
          path: /logs
          retention-days: 7
          if-no-files-found: warn
