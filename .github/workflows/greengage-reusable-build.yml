# .github/workflows/greengage-reusable-build.yml
name: Greengage Reusable Docker Build Workflow

on:
  workflow_call:
    inputs:
      version:
        description: 'Version derived from tag (e.g., 6 or 7)'
        required: true
        type: string
      target_os:
        description: 'Target OS (e.g., ubuntu)'
        required: true
        type: string
      target_os_version:
        description: 'Target OS version (e.g., 22.04)'
        required: true
        type: string
      skip_unittests:
        description: 'Skip Unit tests before building'
        required: false
        type: string
        default: ''
    secrets:
      ghcr_token:
        description: 'GitHub token for GHCR access'
        required: true

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read  # Explicit for default behavior
      packages: write # Required to push to GHCR
      actions: write  # Required for cache
    env:
      IMAGE:          ghcr.io/${{ github.repository }}/ggdb${{ inputs.version }}_${{ inputs.target_os }}${{ inputs.target_os_version }}
      IMAGE_BASE:     ghcr.io/${{ github.repository }}/base_ggdb${{ inputs.version }}_${{ inputs.target_os }}${{ inputs.target_os_version }}
      IMAGE_BASE_HUB: greengagedb/base_ggdb${{ inputs.version }}_${{ inputs.target_os }}${{ inputs.target_os_version }}
      TARGET_OS:      ${{ inputs.target_os }}
      OS_VERSION:     ${{ inputs.target_os_version }}
      SKIP_UNITTESTS: ${{ github.event_name != 'pull_request' && '1' || inputs.skip_unittests }}
    steps:
      - name: Maximize disk space
        uses: greengagedb/greengage-ci/.github/actions/maximize-disk-space@v24

      - name: Enable Docker IPv6
        uses: greengagedb/greengage-ci/.github/actions/enable-docker-ipv6@v51

      - name: Checkout Greengage repo
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          submodules: recursive
          fetch-depth: 0    # Full history for tag resolution
          fetch-tags: true  # Default 'false'
          filter: blob:none # without BLOBs

      - name: Prepare environment
        env:
          REF_NAME: ${{ github.head_ref || github.ref_name }} # Branch name for PRs, branch or tag name for pushes
        run: |
          if [[ "$TARGET_OS" == "ubuntu" ]] ; then # Set GitHub mirrors for Ubuntu
            mirror_ip=$(host azure.archive.ubuntu.com | awk '/has address/{print $NF; exit}')
            if curl -sf --max-time 5 "http://${mirror_ip}/ubuntu/" > /dev/null; then
              echo "DOCKER_OPTIONS=--add-host=archive.ubuntu.com:${mirror_ip} --add-host=security.ubuntu.com:${mirror_ip}" >> "$GITHUB_ENV"
            fi
          fi
          REF_TAG=$(sed 's/[^a-zA-Z0-9._-]/_/g' <<< $REF_NAME)
          if [[ "$REF_TAG" =~ ^(latest|testing|v[0-9]+(\.[0-9]+)*)$ ]]; then
            echo "::error::Ref '$REF_NAME' resolves to reserved tag '$REF_TAG'. Tags 'latest', 'testing' and 'vX[.Y[.Z…]]' are published only by the 'upload' workflow on tag pushes. Rename the branch."
            exit 1
          fi
          echo "REF_TAG=$REF_TAG" >> "$GITHUB_ENV"

      - name: Login to GitHub Container Registry
        continue-on-error: true
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.ghcr_token }}

      # Base image is always built: unchanged layers come from the cache
      - name: Build base image
        run: |
          docker build $DOCKER_OPTIONS \
            --provenance=false \
            --build-arg OS_VERSION \
            --build-arg TARGET_OS \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            --cache-from ${IMAGE_BASE,,}:${{ github.sha }} \
            --cache-from ${IMAGE_BASE,,}:$REF_TAG \
            --cache-from ${IMAGE_BASE,,}:latest \
            --cache-from $IMAGE_BASE_HUB:latest \
            --tag ${IMAGE_BASE,,}:${{ github.sha }} \
            -f ci/Dockerfile.base \
            .

      - name: Push base images
        continue-on-error: true
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ -n "$HEAD_REF" ]; then # On PRs only
            docker tag  ${IMAGE_BASE,,}:${{ github.sha }} ${IMAGE_BASE,,}:$REF_TAG
            docker push ${IMAGE_BASE,,}:$REF_TAG
          fi
          docker push ${IMAGE_BASE,,}:${{ github.sha }}

      # Build developer intermediate image with commit SHA tag
      - name: Build developer image
        run: |
          docker build \
            --provenance=false \
            --build-arg SKIP_UNITTESTS \
            --build-arg BASE_IMAGE=${IMAGE_BASE,,}:${{ github.sha }} \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            --cache-from ${IMAGE,,}:${{ github.sha }} \
            --tag ${IMAGE,,}:${{ github.sha }} \
            -f ci/Dockerfile \
            .

      - name: Push developer images
        id: push
        continue-on-error: true
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ -n "$HEAD_REF" ]; then # On PRs only
            docker tag  ${IMAGE,,}:${{ github.sha }} ${IMAGE,,}:$REF_TAG
            docker push ${IMAGE,,}:$REF_TAG
          fi
          docker push ${IMAGE,,}:${{ github.sha }}

      # Save and cache only when push to GHCR did not succeed (fork PRs, unexpected failures)
      - name: Save SHA image
        if: steps.push.outcome != 'success'
        run: docker save ${IMAGE,,}:${{ github.sha }} > ggdb${{ inputs.version }}_${{ inputs.target_os }}${{ inputs.target_os_version }}_${{ github.sha }}.tar

      - name: Cache SHA image
        if: steps.push.outcome != 'success'
        uses: actions/cache/save@v6
        with:
          path: ggdb${{ inputs.version }}_${{ inputs.target_os }}${{ inputs.target_os_version }}_${{ github.sha }}.tar
          key:  ggdb${{ inputs.version }}_${{ inputs.target_os }}${{ inputs.target_os_version }}_${{ github.sha }}
