# .github/workflows/greengage-reusable-tests-regression.yml
name: Greengage Reusable Regression Tests on GitHub

# Environment variables
env:
  COMPOSE_HTTP_TIMEOUT: 400
  DOCKER_COMPOSE: "docker compose"

# Trigger for reusable workflow
on:
  workflow_call:
    inputs:
      version:
        description: 'Greengage version (e.g., 6 or 7)'
        required: true
        type: string
      target_os:
        description: 'Target OS (e.g., ubuntu)'
        required: true
        type: string
      target_os_version:
        description: 'Target OS version (e.g., 24.04)'
        required: false
        type: string
        default: ''
    secrets:
      ghcr_token:
        description: 'GitHub token for GHCR access'
        required: true

jobs:
  optimizer:  # Regression tests
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        optimizer: [orca, postgres]
    permissions:
      contents: read  # Explicit for default behavior
      packages: read  # Explicit for GHCR access clarity
      actions: write  # Required for cache and artifact upload
    steps:
      - name: Maximize disk space
        uses: greengagedb/greengage-ci/.github/actions/maximize-disk-space@v19

      - name: Enable Docker IPv6
        uses: greengagedb/greengage-ci/.github/actions/enable-docker-ipv6@v51

      - name: Restore & Load SHA image
        uses: greengagedb/greengage-ci/.github/actions/restore-load-image@CI-6187
        with:
          version: ${{ inputs.version }}
          target_os: ${{ inputs.target_os }}
          target_os_version: ${{ inputs.target_os_version }}

      - name: Checkout Greengage repo
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          submodules: recursive

      - name: Regression tests with optimizer '${{ matrix.optimizer }}'
        uses: greengagedb/greengage-ci/.github/actions/tests/regression@CI-6187
        with:
          image: ghcr.io/${{ github.repository }}/ggdb${{ inputs.version }}_${{ inputs.target_os }}${{ inputs.target_os_version }}:${{ github.sha }}
          optimizer: ${{ matrix.optimizer }}
          target_os: ${{ inputs.target_os }}
          target_os_version: ${{ inputs.target_os_version }}

      - name: Collect regression logs
        if: always()
        uses: greengagedb/greengage-ci/.github/actions/collect-logs@CI-6187
        with:
          name: regression_logs_ggdb${{ inputs.version }}_${{ inputs.target_os }}${{ inputs.target_os_version }}_${{ matrix.optimizer }}
          params: |
              /tmp/coverage-data d coverage-data
              gpAdminLogs d gpAdminLogs
              gpdb_src/src/test d results
              gpdb_src/src/test f regression.diffs
              gpdb_src/gpAux/gpdemo/datadirs d log
              gpdb_src/gpAux/gpdemo/datadirs d pg_log
